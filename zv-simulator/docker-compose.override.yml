# OPTIONAL add-on for the autokc `development/docker-compose.yml` stack.
#
# The network-cut-source / network-latency-source scenarios no longer
# require this file: zv-simulator guarantees a toxiproxy itself -
# it reuses a running one, `docker start`s this service's container if
# you created it stopped, or runs its own sidecar (zv-sim-toxiproxy) on
# the stack network. It also repoints and restores the source connector
# config over the Connect REST API by itself. Keep this file only if you
# prefer managing toxiproxy as part of the stack:
#
#   docker compose -f development/docker-compose.yml \
#                   -f zv-simulator/docker-compose.override.yml up -d toxiproxy
#
# The scenarios will detect the running proxy and reuse it (and leave it
# running afterwards, since it wasn't theirs to stop).

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"   # control API - toxiproxy_ctl talks to this
      - "15432:15432" # proxied postgres-source - point Debezium here instead
    networks:
      - default
