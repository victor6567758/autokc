# Ships every container's stdout/stderr to Loki. Discovery + log retrieval
# both go through the mounted docker.sock - no need to bind-mount
# /var/lib/docker/containers.
#
# The "service" label (docker-compose's service name, e.g. "kafka-connect",
# "postgres-source") is what zv-monitor's LogPattern.containerSelectorRegex
# matches against - see com.zv.logs.LogPattern.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-compose-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
