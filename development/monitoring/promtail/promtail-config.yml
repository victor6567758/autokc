# Ships every container's stdout/stderr to Loki. Discovery + log retrieval
# both go through the mounted docker.sock - no need to bind-mount
# /var/lib/docker/containers.
#
# The "service" label (docker-compose's service name, e.g. "kafka-connect",
# "postgres-source") is what zv-monitor's LogPattern.containerSelectorRegex
# matches against - see com.zv.logs.LogPattern. It is kept as the ONLY stream
# label on purpose: the Grafana "Container logs" panel shows labels on every
# line, so a single tight label reads as "service=<name>" per line instead of
# a wall of redundant labels.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-compose-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # keep "service" the only label: container (= development-<service>-1)
      # and compose_project (constant here) add noise in Grafana's per-line
      # label display, so they are deliberately not mapped
