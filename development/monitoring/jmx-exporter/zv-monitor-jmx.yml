# Prometheus JMX exporter config for the zv-monitor app.
# Exposes our custom ConnectorHealth MBeans as Prometheus metrics.
lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # Numeric attributes (Healthy, FailedTaskCount, TotalTaskCount,
  # ConsecutiveFailures, LastCheckedEpochMillis) become gauges automatically.
  # String attributes (ConnectorName, ConnectorState, LastErrorMessage) are
  # silently skipped by the exporter since they can't be gauge values -
  # `connector_health_healthy` is the one to alert on; use the zv-monitor
  # app's own logs, or query the REST API/JMX directly, for the state string.
  - pattern: "com.zv<type=ConnectorHealth, name=(.+)><>(\\w+)"
    name: "connector_health_$2"
    labels:
      connector: "$1"
    type: GAUGE

  # Event counters (com.zv.event.EventCounter) - one per (source, patternId)
  # pair, registered lazily on first hit. Numeric attributes (Count,
  # LastEpochMillis) become gauges; string attributes (PatternId, Source,
  # LastContainer, LastMessage) are silently skipped by the exporter.
  # `zv_event_counter_count{source="log",pattern="npe"}` is the one to alert
  # or chart a rate() on.
  - pattern: "com.zv<type=EventCounter, source=(.+), pattern=(.+)><>(\\w+)"
    name: "zv_event_counter_$3"
    labels:
      source: "$1"
      pattern: "$2"
    type: GAUGE

  # Catch-all for standard JVM metrics (heap, gc, threads, etc.)
  - pattern: ".*"
