# Prometheus config for the dev stack (docker-compose.dev.yml): identical to
# prometheus.yml except the zv-monitor job scrapes the instance running on the
# host (host.docker.internal resolves to the host via the extra_hosts entry in
# docker-compose.dev.yml). Port 5558 must be free on the host - the container
# variant of zv-monitor is disabled in the dev stack.

global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "kafka-connect"
    static_configs:
      - targets: ["kafka-connect:5557"]

  - job_name: "zv-monitor"
    static_configs:
      - targets: ["host.docker.internal:5558"]

  - job_name: "kafka-broker"
    static_configs:
      - targets: ["kafka:5559"]
