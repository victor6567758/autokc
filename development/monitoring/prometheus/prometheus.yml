global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "kafka-connect"
    static_configs:
      - targets: ["kafka-connect:5557"]

  - job_name: "zv-monitor"
    static_configs:
      - targets: ["zv-monitor:5558"]

  - job_name: "kafka-broker"
    static_configs:
      - targets: ["kafka:5559"]
