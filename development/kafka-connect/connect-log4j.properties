# Kafka Connect worker logging, bind-mounted over the stock file in both
# docker-compose stacks (connect-distributed.sh defaults to exactly this path).
# Base is apache/kafka:3.7.0's config/connect-log4j.properties; only the
# switchable connector-component section at the bottom differs.
#
# The ${...} placeholders of that section resolve against JVM system
# properties, which docker-compose passes via KAFKA_OPTS. Flip levels per
# stack bring-up (no rebuild; a `docker compose ... up -d --force-recreate
# kafka-connect` or a make up* is enough):
#   ZV_LOG_LEVEL=DEBUG DEBEZIUM_LOG_LEVEL=DEBUG make up-dev
#
# Levels can also be switched at RUNTIME without any restart, per logger and
# for the whole worker, through the Connect Admin API:
#   curl -X PUT localhost:8083/admin/v1/loggers/com.zv.kcmanager \
#        -H 'Content-Type: application/json' -d '{"level":"DEBUG"}'
#   curl -X PUT localhost:8083/admin/v1/loggers/io.debezium.connector.postgresql \
#        -H 'Content-Type: application/json' -d '{"level":"DEBUG"}'
# (runtime changes survive until the worker restarts; on restart this file's
# defaults apply again).

log4j.rootLogger=INFO, stdout, connectAppender

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

log4j.appender.connectAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.connectAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.connectAppender.File=${kafka.logs.dir}/connect.log
log4j.appender.connectAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.connectAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

log4j.logger.org.apache.zookeeper=ERROR
log4j.logger.org.reflections=ERROR

# ---- switchable connector-component log levels (via KAFKA_OPTS -D flags) ----
# zv connector code, incl. SqlStatementExecutor's "Executing zv SQL statement"
# debug lines (com.zv.kcmanager.*).
log4j.logger.com.zv.kcmanager=${zv.log.level}
# Debezium connectors: source snapshot/streaming + JDBC sink.
log4j.logger.io.debezium.connector.postgresql=${debezium.log.level}
log4j.logger.io.debezium.connector.jdbc=${debezium.log.level}
# Kafka Connect framework: worker, REST, converters.
log4j.logger.org.apache.kafka.connect=${kafka.connect.log.level}
