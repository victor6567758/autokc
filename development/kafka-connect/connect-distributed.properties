# Kafka Connect distributed worker configuration for the development pipeline.
# The kafka-connect service (development/docker-compose.yml) mounts this into
# the apache/kafka image and runs bin/connect-distributed.sh with it.

bootstrap.servers=kafka:29092
group.id=zv-monitor-connect

# REST API
rest.port=8083
rest.advertised.host.name=kafka-connect

# Internal topics (single-broker dev cluster -> replication factor 1)
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=10000

# Converters. The Debezium JDBC sink consumes schema-ful records (Structs),
# so JSON schemas must stay enabled.
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true
# Schema registry binding: the converter-scoped keys below point any
# schema-managed converter (Avro/Protobuf/JSON-Schema, set per connector by
# overriding key.converter/value.converter) at the stack's Apicurio Registry
# via its Confluent-compatible API. The default JSON converters above simply
# ignore them - the wire format stays JSON until a connector opts in.
key.converter.schema.registry.url=http://schema-registry:8080/apis/ccompat/v7
value.converter.schema.registry.url=http://schema-registry:8080/apis/ccompat/v7
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=true
internal.value.converter.schemas.enable=true

# Connector plugins (zv-debezium Postgres source + JDBC sink), baked into the
# image by docker/Dockerfile.kc.
plugin.path=/opt/connect-plugins
